name: Build and test
on:

  workflow_dispatch:
env:
    # we use these in .ci.maven.settings.xml, which is needed to authenticate for core (!) GitHub packages
  MAVEN_SETTINGS_USERNAME_FOR_GITHUB: ${{ 
    secrets.MAVEN_SETTINGS_USERNAME_FOR_GITHUB }}
  MAVEN_SETTINGS_PASSWORD_FOR_GITHUB: ${{ 
    secrets.MAVEN_SETTINGS_PASSWORD_FOR_GITHUB }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
    - name: Build with Maven
      run: mvn --batch-mode --update-snapshots verify
    - name: Set jsprit version (tagged only)
      run: mvn versions:set -DnewVersion=${GITHUB_REF_NAME#v} 
        -DgenerateBackupPoms=false --no-transfer-progress
      if: startsWith(github.ref, 'refs/tags/')
    - name: Publish to GitHub Packages
      if: startsWith(github.ref, 'refs/tags/')
      run: mvn --batch-mode deploy -B --no-transfer-progress -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
